name: Build and Release

permissions:
  contents: write
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build with PyInstaller in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/src -w /src \
          --platform linux/${{ matrix.arch }} \
          python:3.11-slim \
          bash -c "apt-get update && apt-get install -y build-essential binutils patchelf && pip install scons pyinstaller && pip install -r requirements.txt && pyinstaller --onefile flowcase_upload_server.py"

      - name: Package
        run: |
          cd dist
          tar -czvf ../flowcase_upload_server_${{ matrix.arch }}.tar.gz flowcase_upload_server

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-server-${{ matrix.arch }}
          path: flowcase_upload_server_${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Release v1.0.0
          draft: false
          prerelease: false
          files: artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
